services:
  iddqd-light:
    build: .
    container_name: iddqd-support-analyzer-light

    ports:
      - "7860:7860"

    volumes:
      - ./data:/app/data

    environment:
      PYTHONUNBUFFERED: "1"
      IDDQD_EDITION: "light"
      APP_HOST: "0.0.0.0"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).read(1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
