version: '3.8'

services:
  iddqd-light:
    build: .
    container_name: iddqd-support-analyzer-light
    ports:
      - "7860:7860"
    volumes:
      - ./inputs:/app/inputs
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/predict"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
