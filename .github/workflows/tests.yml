name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyzer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py analyzers/*.py tests/test_analyzers.py tests/test_signature_validation.py tests/test_anonymizer_saml.py tests/test_saml_anonymizer.py

      - name: Run analyzer tests
        run: |
          PYTHONPATH=. python tests/test_analyzers.py
          PYTHONPATH=. python tests/test_signature_validation.py
          PYTHONPATH=. python tests/test_anonymizer_saml.py
          PYTHONPATH=. python tests/test_saml_anonymizer.py
