name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyzer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py actions.py chats.py config.py llm.py modules.py reporting.py uploads.py websearch.py vision.py analyzers/*.py tests/*.py

      - name: Run analyzer tests
        run: |
          PYTHONPATH=. python tests/test_log_incidents.py
          PYTHONPATH=. python tests/test_log_timestamps.py
          PYTHONPATH=. python tests/test_log_syslog_ssh.py
          PYTHONPATH=. python tests/test_analyzers.py
          PYTHONPATH=. python tests/test_input_hardening.py
          PYTHONPATH=. python tests/test_signature_validation.py
          PYTHONPATH=. python tests/test_anonymizer_residual.py
          PYTHONPATH=. python tests/test_anonymizer_saml.py
          PYTHONPATH=. python tests/test_anonymize_xml_audit.py
          PYTHONPATH=. python tests/test_saml_anonymizer.py
          PYTHONPATH=. python tests/test_layers.py
          PYTHONPATH=. python tests/test_anonymize_sources.py
          PYTHONPATH=. python tests/test_analyze_routing.py
          PYTHONPATH=. python tests/test_decoded_saml_export.py
          PYTHONPATH=. python tests/test_nameid.py
          PYTHONPATH=. python tests/test_modules.py
          PYTHONPATH=. python tests/test_assistant_handoff.py
          PYTHONPATH=. python tests/test_chat_history.py
          PYTHONPATH=. python tests/test_vision.py
