name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  analyzer-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py actions.py chats.py config.py llm.py modules.py reporting.py uploads.py websearch.py vision.py analyzers/*.py tests/*.py scripts/*.py

      - name: Run analyzer tests (via pytest)
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_chat_history.py \
            --ignore=tests/test_assistant_handoff.py \
            --ignore=tests/test_layers.py \
            --ignore=tests/test_llm.py \
            --ignore=tests/test_vision.py \
            --ignore=tests/test_v022_api.py

  light-edition:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Light dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt

      - name: Compile Light tree
        run: python -m py_compile app.py actions.py config.py modules.py reporting.py uploads.py analyzers/*.py

      - name: Run Light analyzer tests
        run: |
          PYTHONPATH=. python tests/test_analyzers.py
          PYTHONPATH=. python tests/test_saml_metadata.py
          PYTHONPATH=. python tests/test_saml_incident_timing.py
          PYTHONPATH=. python tests/test_nameid.py
          PYTHONPATH=. python tests/test_anonymizer_saml.py
          PYTHONPATH=. python tests/test_edition.py

      - name: Pack Light zip
        run: bash scripts/export-light.sh

      - name: Upload Light zip
        uses: actions/upload-artifact@v6
        with:
          name: iddqd-support-analyzer-light
          path: dist/iddqd-support-analyzer-light-*.zip
